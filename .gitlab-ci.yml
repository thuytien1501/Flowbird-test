workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

info-job:
  script:
    - echo "source=$CI_PIPELINE_SOURCE branch=$CI_COMMIT_BRANCH open_mrs=$CI_OPEN_MERGE_REQUESTS"

dockerize-job:
  script: echo "dockerize on $CI_COMMIT_BRANCH"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH =~ /^chariot.*/

deploy-dev-job:
  when: manual
  script: echo "deploy"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH =~ /^chariot.*/
