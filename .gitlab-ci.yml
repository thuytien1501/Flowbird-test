stages:
  - build
  - client:test
  - client:visual
  - package
  - dockerize
  - deploy


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

variables:
  IMAGE_NAME: "nest"
  IMAGE_TAG: "not_set"


build-job:       
  stage: build
  script:
    - echo "Compiling the code..."
    - echo "Compile complete."

client:unit-test-job:
  image: node:18
  stage: client:test
  variables:
    NODE_OPTIONS: "--max-old-space-size=6144"
  before_script:
    - npm run preinstall:client
  script:
    - npm run test:unit:ci
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    paths:
      - client/coverage/
    when: always
    reports:
      junit:
        - client/junit.xml
  rules:
    - when: always

client:visual-test-job:
  image: mcr.microsoft.com/playwright:v1.62.0-jammy
  stage: client:visual
  interruptible: true
  timeout: 20m
  variables:
    STORYBOOK_PORT: "6006"
    PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
  cache:
    key:
      files:
        - client/package-lock.json
    paths:
      - client/node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - cd client
    - npm ci --cache ../.npm --prefer-offline --no-audit --no-fund
  script:
    - |
      set -e
      npm run build-storybook
      npx --yes http-server storybook-static -p $STORYBOOK_PORT --silent &
      npx --yes wait-on http://localhost:$STORYBOOK_PORT --timeout 30000
      npx playwright test --workers=1
  artifacts:
    paths:
      - client/visual-tests/test-results/
    when: always
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop"
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "staging"
      when: on_success
    - when: manual
      allow_failure: true

config-image_tag:
  stage: .pre
  tags:
    - shell-dev-runner
  script:
    - export IMAGE_TAG=`date "+%y%m%d_%H%M%S"`
    - echo 'configured image tag:' "$IMAGE_TAG"
    - echo "IMAGE_TAG=$IMAGE_TAG" >> build.env
  artifacts:
    reports:
      dotenv: build.env

dockerize-job:
  stage: dockerize
  tags:
    - shell-dev-runner
  before_script:
    - export AWS_ACCESS_KEY_ID=$ECR_ACCESS_KEY
    - export AWS_SECRET_ACCESS_KEY=$ECR_SECRET_ACCESS_KEY
  script:
    - aws ecr get-login-password --region ${ECR_REGION} | docker login --username AWS --password-stdin "${ECR_ACCOUNT}.dkr.ecr.${ECR_REGION}.amazonaws.com"
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f Dockerfile.ecs .
    - docker tag $IMAGE_NAME:$IMAGE_TAG "${ECR_ACCOUNT}.dkr.ecr.${ECR_REGION}.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
    - docker push "${ECR_ACCOUNT}.dkr.ecr.${ECR_REGION}.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"
    - docker image rm $IMAGE_NAME:$IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH =~ /^chariot.*/


.deploy-template:
  stage: deploy
  when: manual
  tags:
    - shell-dev-runner
  script:
    # need to hack together the complete list of parameters, because you can't just change one
    - PARAM_NAMES=$(aws cloudformation describe-stacks --region $AWS_REGION --stack-name "$STACK_NAME" --query "Stacks[0].Parameters[].ParameterKey" --output text | sed -e 's/ImageTag//')
    - cat /dev/null > /tmp/$$
    - for p in $PARAM_NAMES ; do echo -n "ParameterKey=$p,UsePreviousValue=true " >> /tmp/$$ ; done
    - echo -n "ParameterKey=ImageTag,ParameterValue=$IMAGE_TAG" >> /tmp/$$
    - aws cloudformation update-stack --region $AWS_REGION --stack-name "$STACK_NAME" --use-previous-template --parameters $(cat /tmp/$$) --capabilities CAPABILITY_NAMED_IAM --role-arn "$CLOUDFORMATION_ROLE"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"
    - if: $CI_COMMIT_BRANCH =~ /^chariot.*/


deploy-dev-job:
  extends:
    - .deploy-template
  variables:
    STACK_NAME: "ECS-Nest"
    AWS_REGION: "us-east-2"
  before_script:
    - export AWS_ACCESS_KEY_ID=$DEV_APPS_DEPLOYMENT_ACCESS_KEY
    - export AWS_SECRET_ACCESS_KEY=$DEV_APPS_DEPLOYMENT_SECRET_ACCESS_KEY
    - export CLOUDFORMATION_ROLE=$DEV_APPS_DEPLOYMENT_ROLE_ARN


deploy-fr_prod-job:
  extends:
    - .deploy-template
  variables:
    STACK_NAME: "ECS-Nest"
    AWS_REGION: "eu-west-3"
  before_script:
    - export AWS_ACCESS_KEY_ID=$FR_PROD_APPS_DEPLOYMENT_ACCESS_KEY
    - export AWS_SECRET_ACCESS_KEY=$FR_PROD_APPS_DEPLOYMENT_SECRET_ACCESS_KEY
    - export CLOUDFORMATION_ROLE=$FR_PROD_APPS_DEPLOYMENT_ROLE_ARN


deploy-ca_prod-job:
  extends:
    - .deploy-template
  variables:
    STACK_NAME: "ECS-Nest"
    AWS_REGION: "ca-central-1"
  before_script:
    - export AWS_ACCESS_KEY_ID=$CA_PROD_APPS_DEPLOYMENT_ACCESS_KEY
    - export AWS_SECRET_ACCESS_KEY=$CA_PROD_APPS_DEPLOYMENT_SECRET_ACCESS_KEY
    - export CLOUDFORMATION_ROLE=$CA_PROD_APPS_DEPLOYMENT_ROLE_ARN
